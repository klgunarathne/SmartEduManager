<div class="login-shell">
  <main class="login-card">
    <section class="login-hero">
      <div class="brand-mark">EM</div>
      <p class="eyebrow">Secure student exam portal</p>
      <h1>ExamMaster</h1>
      <p>Sign in with your NIC number to start your exam.</p>
    </section>

    <section class="login-form-wrap">
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
        <div class="form-header">
          <span class="step-label">Step 1</span>
          <h2>Student login</h2>
          <p>Use the credentials generated by your instructor.</p>
        </div>

        <div class="form-group">
          <label for="username">NIC number</label>
          <input
            id="username"
            name="username"
            type="text"
            inputmode="text"
            autocomplete="username"
            placeholder="e.g. 200123456789"
            [(ngModel)]="username"
            [disabled]="isLoading()"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            [(ngModel)]="password"
            [disabled]="isLoading()"
            required
          >
        </div>

        <label class="check-row">
          <input type="checkbox" [(ngModel)]="rememberDevice" name="rememberDevice">
          <span>Keep me signed in on this device</span>
        </label>

        @if (error()) {
          <div class="message error">
            {{ error() }}
          </div>
        }

        <button class="primary-btn" type="submit" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="spinner"></span>
          }
          {{ isLoading() ? 'Signing in...' : 'Start exam session' }}
        </button>
      </form>

      <div class="login-help">
        <strong>Need help?</strong>
        <span>Contact your instructor if your credentials are not working.</span>
      </div>
    </section>
  </main>
</div>
