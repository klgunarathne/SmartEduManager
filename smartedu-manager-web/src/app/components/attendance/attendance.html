<div class="page-container">
  <!-- Header -->
  <div class="page-header">
    <div class="header-left">
      <h2>Attendance</h2>
      <p>Mark and view student attendance</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-section">
    <div class="filter-row">
      <div class="filter-group">
        <label>Batch</label>
        <select [(ngModel)]="selectedBatchId" (change)="onBatchChange()">
          <option [value]="0">Select Batch</option>
          @for (batch of batches(); track batch.batchId) {
            <option [value]="batch.batchId">{{ batch.batchCode }}</option>
          }
        </select>
      </div>
      <div class="filter-group">
        <label>Date</label>
        <input type="date" [ngModel]="selectedDate()" (ngModelChange)="selectedDate.set($event); loadAttendanceForDate()">
      </div>
    </div>
  </div>

  @if (isLoading) {
    <div class="loading-state">
      <i class="fas fa-spinner fa-spin"></i>
      <span>Loading...</span>
    </div>
  } @else if (selectedBatchId() > 0) {
    <div class="attendance-card">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>MIS No</th>
              <th>Present</th>
            </tr>
          </thead>
          <tbody>
            @for (student of students(); track student.id) {
              <tr>
                <td>
                  <div class="student-info">
                    <span class="student-name">{{ student.nameWithInitials }}</span>
                  </div>
                </td>
                <td><span class="mis-badge">{{ student.misNo }}</span></td>
                <td>
                  <button 
                    type="button" 
                    class="toggle-btn"
                    [class.present]="isStudentPresent(student.id)"
                    (click)="toggleAttendance(student)"
                  >
                    <i class="fas" [class.fa-check]="isStudentPresent(student.id)" [class.fa-times]="!isStudentPresent(student.id)"></i>
                    {{ isStudentPresent(student.id) ? 'Present' : 'Absent' }}
                  </button>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="3" class="empty-state">
                  <i class="fas fa-user-graduate"></i>
                  <p>No students found in this batch</p>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <div class="attendance-actions">
        <button class="btn btn-primary" (click)="saveAllAttendance()" [disabled]="students().length === 0">
          <i class="fas fa-save"></i> Save Attendance
        </button>
      </div>
    </div>
  }
</div>
