<div class="dashboard-container">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
      <div class="brand-logo">
        <i class="fas fa-graduation-cap"></i>
        <span>SmartEdu Manager</span>
      </div>
    </div>
    
    <div class="navbar-search">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search..." class="search-input">
    </div>
    
    <div class="navbar-actions">
      <button class="action-btn">
        <i class="fas fa-bell"></i>
        <span class="badge">3</span>
      </button>
      <button class="action-btn">
        <i class="fas fa-question-circle"></i>
      </button>
      <div class="user-profile" (click)="toggleProfileMenu()">
        <img [src]="getUserAvatar()" alt="User Profile" class="user-avatar">
        <div class="user-info">
          <span class="user-name">{{ userFirstName() }}</span>
          <span class="user-role">{{ userRole() }}</span>
        </div>
        <button class="profile-menu-btn">
          <i class="fas fa-chevron-down"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Profile Menu -->
  <div class="profile-menu" [class.active]="isProfileMenuOpen" id="profileMenu">
    <div class="menu-header">
      <span class="menu-title">Account</span>
    </div>
    <button class="menu-item">
      <i class="fas fa-user"></i>
      <span>Profile</span>
    </button>
    <button class="menu-item">
      <i class="fas fa-cog"></i>
      <span>Settings</span>
    </button>
    <button class="menu-item">
      <i class="fas fa-question-circle"></i>
      <span>Help</span>
    </button>
    <hr class="menu-divider">
    <button class="menu-item" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </button>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed" id="sidebar">
    <nav class="sidebar-nav">
      <div class="nav-section">
        <span class="section-title">Main Menu</span>
        <div class="nav-items">
          <a routerLink="/instructor/my-courses" routerLinkActive="active" class="nav-item">
            <i class="fas fa-book"></i>
            <span>My Courses</span>
          </a>
          <a routerLink="/instructor/my-batches" routerLinkActive="active" class="nav-item">
            <i class="fas fa-calendar-alt"></i>
            <span>My Batches</span>
          </a>
          <a routerLink="/instructor/my-students" routerLinkActive="active" class="nav-item">
            <i class="fas fa-users"></i>
            <span>My Students</span>
          </a>
          <a routerLink="/instructor/assignments" routerLinkActive="active" class="nav-item">
            <i class="fas fa-tasks"></i>
            <span>Assignments</span>
          </a>
          <a routerLink="/instructor/continuous-assessments" routerLinkActive="active" class="nav-item">
            <i class="fas fa-clipboard-check"></i>
            <span>Assessments</span>
          </a>
        </div>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content" [class.expanded]="isSidebarCollapsed">
    <router-outlet></router-outlet>
  </main>
</div>
